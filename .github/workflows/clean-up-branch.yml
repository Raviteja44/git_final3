name: 4. Cleanup Temp Promotion Branches

on:
  pull_request:
    types: [closed]   # Only triggers when PR is fully closed (merged or not)

permissions:
  contents: write

jobs:
  cleanup-temp-branches:
    runs-on: ubuntu-latest

    # Only run if PR is actually merged (not just closed)
    if: github.event.pull_request.merged == true

    steps:
      - name: Extract source branch name (PR head_ref)
        id: extract
        run: echo "branch_name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Validate if branch is a promotion temp branch
        id: validate
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"
          
          # Branches to never delete
          PROTECT_REGEX="^(main|dev|uat|prod|feature/.*)$"

          if [[ "$BRANCH" =~ $PROTECT_REGEX ]]; then
            echo "is_temp=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Delete only branches starting with promote/
          if [[ "$BRANCH" =~ ^promote/ ]]; then
            echo "is_temp=true" >> $GITHUB_OUTPUT
          else
            echo "is_temp=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not a promotion temp branch
        if: steps.validate.outputs.is_temp == 'false'
        run: |
          echo "Branch '${{ steps.extract.outputs.branch_name }}' is not a temp promotion branch. Skipping deletion."
          exit 0

      - name: Delete temp branch using GitHub API
        if: steps.validate.outputs.is_temp == 'true'
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          echo "Deleting temporary promotion branch: $BRANCH"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}")

          if [[ "$RESPONSE" == "204" ]]; then
            echo "Branch deleted successfully."
          else
            echo "WARNING: Branch deletion returned HTTP $RESPONSE"
          fi

      - name: Completion Message
        run: |
          echo "Cleanup workflow completed for branch: '${{ steps.extract.outputs.branch_name }}'"
