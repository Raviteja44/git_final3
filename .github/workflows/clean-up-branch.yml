name: Cleanup Temp Promotion Branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name from PR head
        id: extract
        run: |
          echo "branch_name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Validate branch is a temp promotion branch
        id: validate
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          # temp promotion branches follow this pattern
          if [[ "$BRANCH" =~ ^promote/ ]]; then
            echo "is_temp_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_temp_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip cleanup for non-temp branches
        if: steps.validate.outputs.is_temp_branch == 'false'
        run: |
          echo "Branch '${{ steps.extract.outputs.branch_name }}' is NOT a promotion temp branch. Skipping cleanup."
          exit 0

      - name: Delete remote temp branch
        if: steps.validate.outputs.is_temp_branch == 'true'
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          echo "Deleting remote temp branch: $BRANCH"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch --all

          # delete the temp branch from origin
          git push origin --delete "$BRANCH" || echo "Warning: branch deletion encountered a non-critical error"

      - name: Cleanup complete
        run: |
          echo "Cleanup completed for: '${{ steps.extract.outputs.branch_name }}'"
