name: 4. Cleanup Temp Branches

on:
  pull_request:
    types: [closed]  # triggers when PR is merged or just closed

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract
        run: |
          echo "branch_name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Validate branch is a temp promotion branch
        id: validate
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          if [[ "$BRANCH" =~ ^promote/ ]]; then
            echo "is_temp_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_temp_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not a temp branch
        if: steps.validate.outputs.is_temp_branch == 'false'
        run: |
          echo "Branch '${{ steps.extract.outputs.branch_name }}' is not a promotion temp branch. Skipping cleanup."
          exit 0

      - name: Delete remote temp branch
        if: steps.validate.outputs.is_temp_branch == 'true'
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          echo "Deleting temporary branch: $BRANCH"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git fetch --all
          git push origin --delete "$BRANCH" || echo "Branch deletion encountered a non-critical error"

      - name: Completion message
        run: |
          echo "Cleanup completed for temp branch: '${{ steps.extract.outputs.branch_name }}'"
