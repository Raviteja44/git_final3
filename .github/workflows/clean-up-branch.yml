name: 4. Cleanup Temp Branches

on:
  pull_request:
    types: [closed]  # triggers when a PR is merged or just closed

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Extract branch name
        id: extract
        run: |
          echo "branch_name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Validate if branch is a temp promotion branch
        id: validate
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          if [[ "$BRANCH" =~ ^promote/ ]]; then
            echo "is_temp_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_temp_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not a temp branch
        if: steps.validate.outputs.is_temp_branch == 'false'
        run: |
          echo "Branch '${{ steps.extract.outputs.branch_name }}' is not a temp promotion branch. Skipping deletion."
          exit 0

      - name: Delete temp branch using GitHub API
        if: steps.validate.outputs.is_temp_branch == 'true'
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          echo "Deleting temp branch via GitHub API: $BRANCH"

          # Delete branch ref using GitHub API
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}"

          echo "Branch delete request sent."

      - name: Completion message
        run: |
          echo "Cleanup complete for: '${{ steps.extract.outputs.branch_name }}'"
