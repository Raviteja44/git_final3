name: 4. Cleanup Temp Promotion Branches

on:
  pull_request:
    types:
      - closed   # triggers when PR is merged or closed

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true   # ONLY cleanup on merge, not when closed without merge

    steps:
      - name: Extract branch name
        id: extract
        run: |
          echo "branch_name=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      - name: Validate branch is a temp promotion branch
        id: validate
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          # Allowed pattern: anything beginning with promote/
          if [[ "$BRANCH" =~ ^promote/ ]]; then
            echo "is_temp_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_temp_branch=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not a temp branch
        if: steps.validate.outputs.is_temp_branch == 'false'
        run: |
          echo "Branch '${{ steps.extract.outputs.branch_name }}' is NOT a promotion temp branch. No cleanup required."
          exit 0

      - name: Delete temp branch from remote
        if: steps.validate.outputs.is_temp_branch == 'true'
        run: |
          BRANCH="${{ steps.extract.outputs.branch_name }}"

          echo "Deleting remote temp branch: $BRANCH"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git fetch --all

          # Delete remote branch: safe, only after PR is merged
          git push origin --delete "$BRANCH" || echo "Branch deletion encountered a non-critical error"

      - name: Completion message
        run: |
          echo "Cleanup completed for branch: '${{ steps.extract.outputs.branch_name }}'"
